<!DOCTYPE html>
<html lang="en" dir="ltr" class="about-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photography — Prisha Agarwalla</title>
  <meta name="description" content="Photography by Prisha Agarwalla">
  <script>
    if (sessionStorage.getItem('page-transition') === 'enter-about') {
      document.documentElement.classList.add('page-transition-pending');
    }
  </script>
  <style>
    .page-transition{position:fixed;inset:0;z-index:100;background:#eee8dc;transform:scaleY(0);transform-origin:bottom center;pointer-events:none}
    html.page-transition-pending .page-transition{transform:scaleY(1)}
  </style>
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Oswald:wght@500;600;700&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="about-page photo-page">
  <div class="page-transition" aria-hidden="true"></div>
  <header class="site-nav" aria-label="Primary navigation">
    <div class="site-nav__primary">
      <a href="index.html" class="site-nav__item" data-page-transition>Work</a>
      <a href="about.html" class="site-nav__item" data-page-transition>About</a>
      <a href="index.html" class="site-nav__brand" data-page-transition>Portfolio</a>
      <a href="mailto:prishaagarwalla50@gmail.com" class="site-nav__item">Contact</a>
      <a href="photography.html" class="site-nav__item" data-page-transition>Photography</a>
    </div>
    <nav class="site-nav__secondary" aria-label="Disciplines">
      <span>Photographer</span>
      <span>Software Developer</span>
      <span>Entrepreneur</span>
      <span>Traveler</span>
      <span>Student</span>
      <span>Computer Scientist</span>
      <span>Tech Enthusiast</span>
    </nav>
  </header>

  <main class="about">
    <header class="about__intro">
      <h1 class="about__title">Photography</h1>
      <p class="about__lead">
        Piles of photographs, sorted roughly by where my head was at.
        Tap one to spread it out.
      </p>
    </header>

    <section class="about__section photo-piles-section">
      <div class="photo-piles" id="photoPiles"></div>
    </section>
  </main>

  <div class="photo-spread" id="photoSpread" hidden>
    <div class="photo-spread__backdrop" data-spread-close></div>
    <div class="photo-spread__panel" role="dialog" aria-modal="true" aria-labelledby="spreadTitle">
      <header class="photo-spread__head">
        <div>
          <h2 class="photo-spread__title" id="spreadTitle"></h2>
          <p class="photo-spread__count"></p>
        </div>
        <button type="button" class="photo-spread__close" data-spread-close aria-label="Close">Close ✕</button>
      </header>
      <div class="photo-spread__track" id="spreadTrack"></div>
      <p class="photo-spread__hint" aria-hidden="true">scroll →</p>
    </div>
  </div>

  <script type="module" src="/src/js/photography.js"></script>
</body>
</html>
